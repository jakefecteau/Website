<!doctype html>
<html lang="en">
  
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Resume</title>
  <link rel="stylesheet" href="styles.css" />
</head>

<body>

  <!-- GLOBAL HEADER -->
  <header class="site-header">
    <div class="wrap site-nav">
      <a href="/" class="site-logo">JF</a>

      <nav class="site-links">
        <a href="/work/">Resume</a>
        <a href="/contact/">Contact</a>
      </nav>
    </div>
  </header>

  <!-- HERO -->
  <header class="hero">
    <div class="wrap hero-grid">

      <!-- Left column -->
      <div>
        <h1 class="hero-title">Jake Fecteau</h1>

        <a class="pill" href="#work">View Resume<span class="arrow">↘</span></a>

        <div class="tiny-bottom">
          <span>Long Island, New York <span class="dot">●</span></span>
        </div>
      </div>

      <!-- Middle copy column -->
      <div class="hero-copy">
        <p class="lead">
          Elevator Pitch (EDIT LATER)
        </p>
      
      </div>

      <!-- Right image card -->
      <div class="hero-right">
        <figure class="portrait-card">
          <img src="img/portrait.JPG" alt="Portrait" />
        </figure>
      </div>

    </div>
  </header>

  <!-- Footer -->
  <footer class="case-footer">
    <div class="wrap case-foot">
      <a class="case-back" href="/contact/">Contact</a>
      <span class="case-credit">© <span id="y"></span> Jake Fecteau </span>
    </div>
  </footer>

  <script>
    document.getElementById('y').textContent = new Date().getFullYear();
  </script>

</body>
</html>
